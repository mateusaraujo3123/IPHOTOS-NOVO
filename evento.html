<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de Fotos - iphotos</title>
  <!-- Link direcionado para o novo arquivo de estilo separado -->
  <link rel="stylesheet" href="evento.css">
</head>
<body>

  <!-- HEADER -->
  <header class="meu-header">
    <a href="index.html" class="logo">iphoto<span>s</span></a>
    <nav class="menu-links">
      <a href="index.html">Voltar para a Vitrine</a>
    </nav>
  </header>

  <!-- BANNER DO EVENTO SELECIONADO -->
  <section class="banner-evento">
    <h1>🐎 Circuito Vaquejada PE - Etapa 01</h1>
    <p>Organizado por Coberturas Nordeste • Fotos protegidas por direitos autorais</p>
  </section>

  <!-- BUSCA POR NÚMERO DO COMPETIDOR -->
  <div class="barra-busca-atleta">
    <input type="text" placeholder="Digite seu número de competidor (Ex: 102)" class="input-atleta" />
    <button class="btn-busca-atleta">Buscar</button>
  </div>

  <!-- VITRINE DE IMAGENS DISPONÍVEIS -->
  <div class="vitrine-fotos">
    <div class="grid-fotos">
      
      <!-- CARD FOTO 1 -->
      <div class="card-foto">
        <div class="wrapper-imagem">
          <div style="width:100%; height:100%; background:#cbd5e1; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:40px;">🐎</div>
          <div class="marca-dagua">iphotos</div>
        </div>
        <div class="info-foto">
          <span class="preco-foto">R$ 12,00</span>
          <button class="btn-carrinho" onclick="alert('Foto adicionada ao carrinho!')">Comprar</button>
        </div>
      </div>

      <!-- CARD FOTO 2 -->
      <div class="card-foto">
        <div class="wrapper-imagem">
          <div style="width:100%; height:100%; background:#cbd5e1; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:40px;">🐎</div>
          <div class="marca-dagua">iphotos</div>
        </div>
        <div class="info-foto">
          <span class="preco-foto">R$ 12,00</span>
          <button class="btn-carrinho" onclick="alert('Foto adicionada ao carrinho!')">Comprar</button>
        </div>
      </div>

      <!-- CARD FOTO 3 -->
      <div class="card-foto">
        <div class="wrapper-imagem">
          <div style="width:100%; height:100%; background:#cbd5e1; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:40px;">🐎</div>
          <div class="marca-dagua">iphotos</div>
        </div>
        <div class="info-foto">
          <span class="preco-foto">R$ 12,00</span>
          <button class="btn-carrinho" onclick="alert('Foto adicionada ao carrinho!')">Comprar</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
