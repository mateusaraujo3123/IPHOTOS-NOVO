<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iphotos - Encontre suas fotos</title>
  <!-- Vinculação do CSS externo para não quebrar a página -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="meu-header">
    <a href="index.html" class="logo">iphoto<span>s</span></a>
    <nav class="menu-links">
      <a href="login.html">Minhas compras</a>
      <a href="cadastro.html">Sou Fotógrafo</a>
      <a href="cadastro.html">Organização</a>
    </nav>
    <div>
      <a href="login.html" class="btn-login">Login</a>
    </div>
  </header>

  <!-- HERO / BANNER DE BUSCA -->
  <section class="hero">
    <h1>suas fotos aqui!</h1>
    <div class="container-busca">
      <input type="text" id="campo-busca-texto" placeholder="Digite o nome do evento" class="input-busca" oninput="filtrarEventos()" />
      <button class="btn-busca">🔍</button>
    </div>
  </section>

  <!-- BARRA DE CATEGORIAS SEPARADAS -->
  <div class="barra-categorias">
    <div class="container-categorias">
      <button class="btn-categoria ativo" id="cat-todos" onclick="filtrarPorCategoria('todos')">
        <span class="icone-categoria">🌐</span>
        <span>Todos</span>
      </button>
      <button class="btn-categoria" id="cat-vaquejada" onclick="filtrarPorCategoria('vaquejada')">
        <span class="icone-categoria">🐎</span>
        <span>Vaquejada</span>
      </button>
      <button class="btn-categoria" id="cat-ciclismo" onclick="filtrarPorCategoria('ciclismo')">
        <span class="icone-categoria">🚴</span>
        <span>Ciclismo</span>
      </button>
      <button class="btn-categoria" id="cat-corrida" onclick="filtrarPorCategoria('corrida')">
        <span class="icone-categoria">🏃‍♂️</span>
        <span>Corrida</span>
      </button>
      <button class="btn-categoria" id="cat-futebol" onclick="filtrarPorCategoria('futebol')">
        <span class="icone-categoria">⚽</span>
        <span>Futebol</span>
      </button>
    </div>
  </div>

  <!-- VITRINE COM FILTRAGEM DINÂMICA -->
  <div class="conteudo">
    <div class="titulo-secao">
      <h2 id="titulo-listagem">Todos os Eventos</h2>
      <span class="tag-status" id="contador-eventos">0 disponíveis</span>
    </div>

    <!-- Onde os cards corretos aparecem de forma isolada -->
    <div class="grid-eventos" id="grid-eventos-dinamico"></div>
  </div>

  <!-- LÓGICA DE EVENTOS POR CATEGORIA -->
  <script>
    // Banco de dados simulando os uploads reais dos fotógrafos nas categorias certas
    const eventosBD = [
      {
        id: 1,
        titulo: "Grande Vaquejada de Caruaru - Parque Ivânio Cunha",
        categoria: "vaquejada",
        icone: "🐎",
        local: "Caruaru, PE",
        data: "28/07/2026"
      },
      {
        id: 2,
        titulo: "Bolão de Vaquejada Noturno - Parque Haras",
        categoria: "vaquejada",
        icone: "🐎",
        local: "Bezerros, PE",
        data: "25/07/2026"
      },
      {
        id: 3,
        titulo: "Desafio de Ciclismo Speed e MTB do Agreste",
        categoria: "ciclismo",
        icone: "🚴",
        local: "Garanhuns, PE",
        data: "26/07/2026"
      },
      {
        id: 4,
        titulo: "Corrida de Rua da Emancipação 5K e 10K",
        categoria: "corrida",
        icone: "🏃‍♂️",
        local: "Recife, PE",
        data: "19/07/2026"
      },
      {
        id: 5,
        titulo: "Final da Copa Regional de Futebol de Campo",
        categoria: "futebol",
        icone: "⚽",
        local: "Olinda, PE",
        data: "12/07/2026"
      }
    ];

    let categoriaSelecionada = 'todos';

    function renderizarEventos(lista) {
      const grid = document.getElementById('grid-eventos-dinamico');
      const contador = document.getElementById('contador-eventos');
      grid.innerHTML = "";

      contador.innerText = `${lista.length} ${lista.length === 1 ? 'disponível' : 'disponíveis'}`;

      if (lista.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">
            <p style="font-size: 16px; font-weight: bold;">Nenhum evento desta modalidade cadastrado ainda.</p>
          </div>
        `;
        return;
      }

      lista.forEach(evento => {
        grid.innerHTML += `
          <a href="evento.html" class="card-evento">
            <div class="card-imagem-placeholder">${evento.icone}</div>
            <div class="card-info">
              <div>
                <h3>${evento.titulo}</h3>
                <div class="card-detalhes">
                  <p>📍 ${evento.local}</p>
                  <p>📅 ${evento.data}</p>
                </div>
              </div>
              <span class="tag-categoria">${evento.categoria}</span>
            </div>
          </a>
        `;
      });
    }

    function filtrarPorCategoria(categoria) {
      categoriaSelecionada = categoria;
      document.querySelectorAll('.btn-categoria').forEach(btn => btn.classList.remove('ativo'));
      
      if(categoria === 'todos') document.getElementById('cat-todos').classList.add('ativo');
      else document.getElementById(`cat-${categoria}`).classList.add('ativo');

      const titulos = {
        todos: "Todos os Eventos",
        vaquejada: "Coberturas de Vaquejada",
        ciclismo: "Eventos de Ciclismo",
        corrida: "Corridas de Rua",
        futebol: "Partidas de Futebol"
      };
      document.getElementById('titulo-listagem').innerText = titulos[categoria];

      filtrarEventos();
    }

    function filtrarEventos() {
      const textoBusca = document.getElementById('campo-busca-texto').value.toLowerCase();

      const resultado = eventosBD.filter(evento => {
        const matchesCategoria = (categoriaSelecionada === 'todos' || evento.categoria === categoriaSelecionada);
        const matchesTexto = evento.titulo.toLowerCase().includes(textoBusca) || evento.local.toLowerCase().includes(textoBusca);
        return matchesCategoria && matchesTexto;
      });

      renderizarEventos(resultado);
    }

    window.onload = () => {
      renderizarEventos(eventosBD);
    };
  </script>
</body>
</html>
