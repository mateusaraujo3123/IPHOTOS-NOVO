<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iphotos - Encontre suas fotos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="meu-header" id="header-dinamico">
    <a href="index.html" class="logo">iphoto<span id="logo-dot">s</span></a>
    <nav class="menu-links">
      <a href="minhas-compras.html">Minhas compras</a>
      <a href="cadastro.html">Sou Fotógrafo</a>
      <a href="cadastro.html">Organização</a>
    </nav>
    <div>
      <a href="login.html" class="btn-login" id="btn-login-dinamico">Login</a>
    </div>
  </header>

  <!-- FAIXA DE AVISO -->
  <div class="faixa-aviso" id="faixa-dinamica">
    Você está vendo eventos do Brasil 🔽
  </div>

  <!-- HERO / REGIAO DE BUSCA -->
  <section class="hero">
    <h1>suas fotos aqui!</h1>
    <div class="container-busca">
      <input type="text" id="campo-busca-texto" placeholder="Digite o nome do evento..." class="input-busca" oninput="filtrarEventos()" />
      <button class="btn-busca" id="btn-busca-dinamico">🔍</button>
    </div>
  </section>

  <!-- BARRA HORIZONTAL DE CATEGORIAS (Gerada Automaticamente por Script) -->
  <div class="barra-categorias">
    <div class="container-categorias" id="container-botoes-categorias">
      <!-- Os botões do CorelDraw nascerão aqui sozinhos via JS -->
    </div>
  </div>

  <!-- VITRINE DE EVENTOS -->
  <div class="conteudo">
    <div class="titulo-secao">
      <h2 id="titulo-listagem">Todos os Eventos</h2>
      <span class="tag-status" id="contador-eventos">0 disponíveis</span>
    </div>

    <div class="grid-eventos" id="grid-eventos-dinamico"></div>
  </div>

  <script>
    // =========================================================================
    // ⚙️ CENTRAL DE EXPANSÃO: ADICIONE NOVAS CATEGORIAS AQUI NO FUTURO
    // =========================================================================
    const listaCategoriasBD = [
      { id: "vaquejada", nome: "Vaquejada", iconeURL: "vaquejada.png", altFallback: "🐎", tituloSecao: "Coberturas de Vaquejada" },
      { id: "ciclismo", nome: "Ciclismo", iconeURL: "ciclismo.png", altFallback: "🚴", tituloSecao: "Eventos de Ciclismo" },
      { id: "corrida", nome: "Corrida", iconeURL: "corrida.png", altFallback: "🏃", tituloSecao: "Corridas de Rua" },
      { id: "futebol", nome: "Futebol", iconeURL: "futebol.png", altFallback: "⚽", tituloSecao: "Partidas de Futebol" }
      // Para adicionar mais, basta colocar uma vírgula e copiar o modelo acima aqui embaixo.
    ];

    // BANCO DE DADOS DOS EVENTOS DOS FOTÓGRAFOS
    const eventosBD = [
      { id: 1, titulo: "Circuito Vaquejada PE - Etapa Regional", categoria: "vaquejada", altFallback: "🐎", fotoCapaURL: "https://unsplash.com", local: "Caruaru, PE", data: "28/07/2026" },
      { id: 2, titulo: "Grande Bolão de Vaquejada do Agreste", categoria: "vaquejada", altFallback: "🐎", fotoCapaURL: "https://unsplash.com", local: "Bezerros, PE", data: "25/07/2026" },
      { id: 3, titulo: "Desafio das Opalas de Ciclismo", categoria: "ciclismo", altFallback: "🚴", fotoCapaURL: "https://unsplash.com", local: "Recife, PE", data: "26/07/2026" },
      { id: 4, titulo: "Corrida de Rua da Independência 10K", categoria: "corrida", altFallback: "🏃‍♂️", fotoCapaURL: "https://unsplash.com", local: "Garanhuns, PE", data: "19/07/2026" },
      { id: 5, titulo: "Campeonato Intermunicipal de Futebol Amador", categoria: "futebol", altFallback: "⚽", fotoCapaURL: "https://unsplash.com", local: "Petrolina, PE", data: "12/07/2026" }
    ];

    let categoriaSelecionada = 'todos';
    let ordemDoAdmin = ['vaquejada', 'ciclismo', 'corrida', 'futebol'];
    let coresCategoria = { vaquejada: '#00b4d8', ciclismo: '#00b4d8', corrida: '#00b4d8', futebol: '#00b4d8' };

    window.onload = () => {
      if(localStorage.getItem('iphotos_primaria')) {
        document.documentElement.style.setProperty('--cor-primaria', localStorage.getItem('iphotos_primaria'));
      }
      if(localStorage.getItem('iphotos_topo')) {
        document.getElementById('header-dinamico').style.backgroundColor = localStorage.getItem('iphotos_topo');
      }
      if(localStorage.getItem('iphotos_cores_cat')) {
        coresCategoria = JSON.parse(localStorage.getItem('iphotos_cores_cat'));
      }
      if(localStorage.getItem('iphotos_ordem')) {
        ordemDoAdmin = JSON.parse(localStorage.getItem('iphotos_ordem'));
      }

      gerarBotonesCategoriasMecanico();
      filtrarEventos();
    };

    // FUNÇÃO QUE DESENHA OS BOTÕES DO COREL NA TELA SOZINHA
    function gerarBotonesCategoriasMecanico() {
      const container = document.getElementById('container-botoes-categorias');
      
      // Cria primeiro o botão "Todos" fixo
      container.innerHTML = `
        <button class="btn-categoria ativo" id="cat-todos" onclick="filtrarPorCategoria('todos')">
          <img src="assets/categorias/todos.png" alt="Todos" class="img-categoria" onerror="this.src='https://placehold.co🌐'">
          <span>Todos</span>
        </button>
      `;

      // Varre a lista central e cria os outros botões automaticamente
      listaCategoriasBD.forEach(cat => {
        container.innerHTML += `
          <button class="btn-categoria" id="cat-${cat.id}" onclick="filtrarPorCategoria('${cat.id}')">
            <img src="assets/categorias/${cat.iconeURL}" alt="${cat.nome}" class="img-categoria" onerror="this.src='https://placehold.co${cat.altFallback}'">
            <span>${cat.nome}</span>
          </button>
        `;
      });
    }

    function renderizarEventos(lista) {
      const grid = document.getElementById('grid-eventos-dinamico');
      const contador = document.getElementById('contador-eventos');
      grid.innerHTML = "";

      contador.innerText = `${lista.length} ${lista.length === 1 ? 'disponível' : 'disponíveis'}`;

      if (lista.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#64748b;">Nenhum evento encontrado</div>`;
        return;
      }

      lista.sort((a, b) => {
        return ordemDoAdmin.indexOf(a.categoria) - ordemDoAdmin.indexOf(b.categoria);
      });

      lista.forEach(evento => {
        const corDaTag = coresCategoria[evento.categoria] || 'var(--cor-primaria)';

        grid.innerHTML += `
          <a href="evento.html" class="card-evento">
            <div class="card-capa-wrapper">
              <span class="badge-icone-categoria">${evento.altFallback}</span>
              <img src="${evento.fotoCapaURL}" alt="${evento.titulo}" class="img-capa-evento" onerror="this.src='https://placehold.co'">
            </div>
            <div class="card-info">
              <div>
                <h3>${evento.titulo}</h3>
                <div class="card-detalhes">
                  <p>📍 ${evento.local}</p>
                  <p>📅 ${evento.data}</p>
                </div>
              </div>
              <span class="tag-categoria" style="color: ${corDaTag}">${evento.categoria}</span>
            </div>
          </a>
        `;
      });
    }

    function filtrarPorCategoria(categoria) {
      categoriaSelecionada = categoria;
      document.querySelectorAll('.btn-categoria').forEach(btn => btn.classList.remove('ativo'));
      document.getElementById(`cat-${categoria}`).classList.add('ativo');
      
      if(categoria === 'todos') {
        document.getElementById('logo-dot').style.color = 'var(--cor-primaria)';
        document.getElementById('btn-login-dinamico').style.backgroundColor = 'var(--cor-primaria)';
        document.getElementById('faixa-dinamica').style.backgroundColor = 'var(--cor-primaria)';
        document.getElementById('btn-busca-dinamico').style.backgroundColor = 'var(--cor-primaria)';
        document.getElementById('titulo-listagem').innerText = "Todos os Eventos";
      } else {
        const corAtiva = coresCategoria[categoria] || 'var(--cor-primaria)';
        document.getElementById('logo-dot').style.color = corAtiva;
        document.getElementById('btn-login-dinamico').style.backgroundColor = corAtiva;
        document.getElementById('faixa-dinamica').style.backgroundColor = corAtiva;
        document.getElementById('btn-busca-dinamico').style.backgroundColor = corAtiva;
        
        // Acha o título da seção na lista automatizada
        const catInfo = listaCategoriasBD.find(c => c.id === categoria);
        document.getElementById('titulo-listagem').innerText = catInfo ? catInfo.tituloSecao : "Eventos";
      }

      filtrarEventos();
    }

    function filtrarEventos() {
      const textoBusca = document.getElementById('campo-busca-texto').value.toLowerCase();
      const resultado = eventosBD.filter(evento => {
        const matchesCategoria = (categoriaSelecionada === 'todos' || evento.categoria === categoriaSelecionada);
        const matchesTexto = evento.titulo.toLowerCase().includes(textoBusca) || evento.local.toLowerCase().includes(textoBusca);
        return matchesCategoria && matchesTexto;
      });
      renderizarEventos(resultado);
    }
  </script>
</body>
</html>
