<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - iphotos</title>
  <!-- Link direcionado para a mesma folha de estilo única de acesso -->
  <link rel="stylesheet" href="acesso.css">
</head>
<body>

  <!-- HEADER -->
  <header class="meu-header">
    <a href="index.html" class="logo">iphoto<span>s</span></a>
    <nav class="menu-links">
      <a href="index.html">Voltar para a Home</a>
    </nav>
  </header>

  <!-- FORMULÁRIO DE CADASTRO -->
  <div class="container-formulario">
    <div class="card-formulario">
      <h2>Crie sua conta</h2>
      <p class="subtitulo">Já possui cadastro? <a href="login.html">Faça login</a></p>
      
      <div class="seletor-perfil">
        <div class="opcao-perfil ativo" id="aba-cliente" onclick="mudarAba('cliente')">Sou Cliente</div>
        <div class="opcao-perfil" id="aba-fotografo" onclick="mudarAba('fotografo')">Sou Fotógrafo</div>
      </div>

      <form onsubmit="executarCadastro(event)">
        <div class="grupo-input">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" placeholder="Seu nome" required />
        </div>

        <div class="grupo-input">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required />
        </div>

        <!-- Campos de Fotógrafo -->
        <div id="campos-extras" class="campos-fotógrafo">
          <div class="grupo-input">
            <label for="regiao">Região principal de atuação</label>
            <select id="regiao">
              <option value="">Selecione seu Estado</option>
              <option value="PE">Pernambuco</option>
              <option value="AL">Alagoas</option>
              <option value="PB">Paraíba</option>
            </select>
          </div>
          <div class="grupo-input">
            <label for="portfolio">Link do Portfólio / Instagram</label>
            <input type="url" id="portfolio" placeholder="https://instagram.com" />
          </div>
        </div>

        <div class="grupo-input">
          <label for="senha">Crie uma Senha</label>
          <input type="password" id="senha" placeholder="No mínimo 6 caracteres" required />
        </div>
        
        <button type="submit" class="btn-enviar">Criar Conta</button>
      </form>
    </div>
  </div>

  <script>
    let perfilAtual = 'cliente';

    function mudarAba(tipo) {
      perfilAtual = tipo;
      const abaCliente = document.getElementById('aba-cliente');
      const abaFotografo = document.getElementById('aba-fotografo');
      const camposExtras = document.getElementById('campos-extras');
      const portfolioInput = document.getElementById('portfolio');

      if (tipo === 'cliente') {
        abaCliente.classList.add('ativo');
        abaFotografo.classList.remove('ativo');
        camposExtras.style.display = 'none';
        portfolioInput.removeAttribute('required');
      } else {
        abaFotografo.classList.add('ativo');
        abaCliente.classList.remove('ativo');
        camposExtras.style.display = 'block';
        portfolioInput.setAttribute('required', 'true');
      }
    }

    function executarCadastro(e) {
      e.preventDefault();
      if (perfilAtual === 'fotografo') {
        window.location.href = 'painel-fotografo.html';
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>

</body>
</html>
