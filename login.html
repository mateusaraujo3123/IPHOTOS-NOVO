<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - iphotos</title>
  <!-- Link direcionado para a folha de estilo única de acesso -->
  <link rel="stylesheet" href="acesso.css">
</head>
<body>

  <!-- HEADER -->
  <header class="meu-header">
    <a href="index.html" class="logo">iphoto<span>s</span></a>
    <nav class="menu-links">
      <a href="index.html">Voltar para a Home</a>
    </nav>
  </header>

  <!-- FORMULÁRIO DE LOGIN -->
  <div class="container-formulario">
    <div class="card-formulario">
      <h2>Acesse sua conta</h2>
      <p class="subtitulo">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
      
      <form onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div class="grupo-input">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required />
        </div>
        
        <div class="grupo-input">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required />
        </div>
        
        <div class="esqueceu-senha">
          <a href="#" onclick="alert('Funcionalidade de recuperação em desenvolvimento.')">Esqueceu sua senha?</a>
        </div>
        
        <button type="submit" class="btn-enviar">Entrar</button>
      </form>
    </div>
  </div>

</body>
</html>
