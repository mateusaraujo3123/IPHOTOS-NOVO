<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - iphotos</title>
  <!-- Link direcionado para a folha de estilo única de acesso -->
  <link rel="stylesheet" href="acesso.css">
</head>
<body>

  <!-- HEADER -->
  <header class="meu-header">
    <a href="index.html" class="logo">iphoto<span>s</span></a>
    <nav class="menu-links">
      <a href="index.html">Voltar para a Home</a>
    </nav>
  </header>

  <!-- FORMULÁRIO DE LOGIN -->
  <div class="container-formulario">
    <div class="card-formulario">
      <h2>Acesse sua conta</h2>
      <p class="subtitulo">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
      
      <!-- Lógica corrigida executando a função JavaScript de persistência -->
      <form onsubmit="executarLoginSimulado(event)">
        <!-- NOVO: Campo de nome adicionado temporariamente para simular o banco de dados -->
        <div class="grupo-input">
          <label for="nome-login">Seu Nome de Usuário</label>
          <input type="text" id="nome-login" placeholder="Ex: Lucas Silva" required />
        </div>

        <div class="grupo-input">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required />
        </div>
        
        <div class="grupo-input">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required />
        </div>
        
        <div class="esqueceu-senha">
          <a href="#" onclick="alert('Funcionalidade de recuperação em desenvolvimento.')">Esqueceu sua senha?</a>
        </div>
        
        <button type="submit" class="btn-enviar">Entrar</button>
      </form>
    </div>
  </div>

  <script>
    // FUNÇÃO CORRIGIDA: Captura o nome digitado, grava no navegador e joga pro Index
    function executarLoginSimulado(e) {
      e.preventDefault();
      
      const nomeDigitado = document.getElementById('nome-login').value;
      
      // Salva no armazenamento local exatamente onde o index.html está programado para ler
      localStorage.setItem('iphotos_nome_usuario', nomeDigitado);
      
      // Redireciona para a página inicial com o login ativo
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
